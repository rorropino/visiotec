name: VisioTec portfolio - live diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet 'paramiko>=3,<5'
      - name: Check database and admin without exposing credentials
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PROD_PATH: ${{ secrets.CPANEL_PROD_PATH }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'deploy')
          from pathlib import Path
          ns={'__name__':'portfolio_diagnostic'}
          exec(Path('deploy/production.py').read_text().split('changes=[]',1)[0],ns)
          import posixpath as pp, urllib.request, urllib.error, secrets, json, os, time, base64
          sftp=ns['sftp'];client=ns['client'];exists=ns['exists'];write=ns['write']
          raw=pp.normpath(os.environ['CPANEL_PROD_PATH']);user=os.environ['CPANEL_USER']
          candidates=[raw]
          if raw.startswith('/home/'+user+'/'):candidates.append(raw[len('/home/'+user):])
          target=next((p for p in candidates if exists(pp.join(p,'portfolio','lib.php'))),None)
          if not target:raise RuntimeError('Portfolio directory not found')
          token=secrets.token_hex(32);name='vtdiag-'+secrets.token_hex(18)+'.php'
          path=pp.join(target,'portfolio',name)
          candidate=pp.join(target,'portfolio','private','diag-'+secrets.token_hex(18)+'.php')
          candidate_name=pp.basename(candidate)
          db={k.lower():os.environ.get(k,'') for k in ('DB_HOST','DB_NAME','DB_USER','DB_PASS')}
          db['db_host']=db['db_host'] or 'localhost'
          have_candidate=all(db[k] for k in ('db_name','db_user','db_pass'))
          php="""<?php
          ini_set('display_errors','0');
          header('Cache-Control: no-store');header('Content-Type: application/json');
          if(!hash_equals('TOKEN', $_SERVER['HTTP_X_VT_DIAG']??'')){http_response_code(404);exit;}
          $r=['php'=>PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION,'pdo_mysql'=>extension_loaded('pdo_mysql'),'mbstring'=>extension_loaded('mbstring'),'config_file'=>is_file(__DIR__.'/private/config.php'),'config_readable'=>is_readable(__DIR__.'/private/config.php')];
          try {
            require __DIR__.'/lib.php';
            $c=vt_config();$r['config_valid']=true;
            $db=vt_db();$r['connected']=true;
            $db=vt_ready();$r['initialized']=true;
            $r['project_count']=count(vt_projects($db));
            $r['markup']=strpos(vt_portfolio_markup($db),'data-portfolio-source="mysql"')!==false;
            $r['admin_initialized']=$db->query("SELECT setting_value FROM vt_settings WHERE setting_key='admin_hash'")->fetchColumn()!==false;
          } catch(Throwable $e){$r['error_type']=get_class($e);if($e instanceof PDOException){$r['sqlstate']=$e->errorInfo[0]??'unknown';$r['driver_code']=(int)($e->errorInfo[1]??0);}}
          $candidate=__DIR__.'/private/CANDIDATE';
          $r['github_secrets_available']=is_file($candidate);
          if(is_file($candidate)){
            try{
              $g=require $candidate;$c=vt_config();
              $r['github_secrets_match_runtime']=true;
              foreach(['db_host','db_name','db_user','db_pass'] as $k){if(!hash_equals((string)$c[$k],(string)$g[$k]))$r['github_secrets_match_runtime']=false;}
              $probe=new PDO('mysql:host='.$g['db_host'].';dbname='.$g['db_name'].';charset=utf8mb4',$g['db_user'],$g['db_pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $probe->query('SELECT 1');$r['github_secrets_connected']=true;
            }catch(Throwable $e){$r['github_secrets_connected']=false;if($e instanceof PDOException){$r['github_secrets_driver_code']=(int)($e->errorInfo[1]??0);}}
          }
          echo json_encode($r);
          """.replace('TOKEN',token).replace('CANDIDATE',candidate_name).encode()
          def fetch(path,headers=None):
              req=urllib.request.Request('https://www.visiotec.cl/'+path,headers={'Cache-Control':'no-cache','User-Agent':'VisioTec-check/3',**(headers or {})})
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:return resp.status,resp.read(200000)
              except urllib.error.HTTPError as e:return e.code,e.read(200000)
          try:
              if have_candidate:
                  encoded=base64.b64encode(json.dumps(db).encode()).decode()
                  body=("<?php return json_decode(base64_decode('"+encoded+"'),true,512,JSON_THROW_ON_ERROR);").encode()
                  write(candidate,body,0o600)
              write(path,php)
              status,body=fetch('portfolio/'+name,{'X-VT-Diag':token})
              if status==200:
                  try:print('Database diagnostic:',json.dumps(json.loads(body)),flush=True)
                  except ValueError:print('Diagnostic did not return JSON',flush=True)
              else:print('Diagnostic HTTP',status,flush=True)
              for p in ['','portfolio-admin/','portfolio-admin/index.php','portfolio/private/config.php']:
                  status,body=fetch(p+'?vt_check='+str(time.time_ns()))
                  print('HTTP',p or '/',status,'mysql=',b'data-portfolio-source="mysql"' in body,'setup=',b'Activar administrador' in body,'login=',b'Iniciar sesi' in body,'pending=',b'Configuraci' in body and b'pendiente' in body,flush=True)
          finally:
              try:
                  for p in (path,candidate):
                      if exists(p):sftp.remove(p)
              finally:sftp.close();client.close()
          PY
