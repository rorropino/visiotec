name: VisioTec web - production
on:
  push:
    branches: [main, redesign-v2]
    paths: ['site/**', 'deploy/**', 'qa/**', '.github/workflows/visiotec-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visiotec-web-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend
        run: |
          node --check site/assets/js/visiotec-v2.js
          python3 deploy/validate.py
          python3 -m py_compile deploy/production.py deploy/migrate_php.py deploy/provision_portfolio.py
          find site -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 deploy/test_migrate.py
      - name: Browser regression
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8766 --bind 127.0.0.1 -d site >/tmp/visiotec-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          node qa/smoke.cjs
  mysql-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
          MYSQL_DATABASE: vt_test
          MYSQL_USER: vt_test
          MYSQL_PASSWORD: ci-test-only-password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - name: MySQL integration and initial seed
        run: |
          printf '%s\n' '<?php return ["db_host"=>"127.0.0.1","db_name"=>"vt_test","db_user"=>"vt_test","db_pass"=>"ci-test-only-password","setup_code"=>"ci-test-only-code"];' > site/portfolio/private/config.php
          php qa/portfolio_mysql.php
  deploy:
    needs: [validate, mysql-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet 'paramiko>=3,<5'
      - name: Deploy safely
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PROD_PATH: ${{ secrets.CPANEL_PROD_PATH }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          PORTFOLIO_SETUP_CODE: ${{ secrets.PORTFOLIO_SETUP_CODE }}
        run: python3 deploy/production.py
