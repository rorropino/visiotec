name: linear-github-sync-ci

on:
  push:
    paths:
      - "bounties/linear-github-sync/**"
      - ".github/workflows/linear-github-sync-ci.yml"
  pull_request:
    paths:
      - "bounties/linear-github-sync/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bounties/linear-github-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
